{% extends 'base.html' %}
{% block title %}Паралелки{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Паралелки</h1>
<div class="grid md:grid-cols-2 gap-6">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6">
        <h2 class="font-semibold mb-4">Додај паралелка</h2>
        <form method="POST" class="flex gap-2">
            <input type="hidden" name="action" value="add">
            <input type="text" name="name" placeholder="пр. I-1" required
                class="flex-1 px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm">
            <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm">Додај</button>
        </form>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 font-semibold">Паралелки ({{ classes|length }})</div>
        {% if classes %}
        <div class="divide-y divide-gray-100 dark:divide-gray-700">
            {% for c in classes %}
            <div class="px-6 py-3 flex items-center justify-between">
                <span>{{ c.name }}</span>
                <form method="POST" onsubmit="return confirm('Избриши {{ c.name }}?')">
                    <input type="hidden" name="action" value="delete">
                    <input type="hidden" name="class_id" value="{{ c.id }}">
                    <button class="text-sm text-red-500 hover:text-red-700">Избриши</button>
                </form>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="px-6 py-6 text-center text-gray-400">Нема паралелки.</div>
        {% endif %}
    </div>
</div>
{% endblock %}
