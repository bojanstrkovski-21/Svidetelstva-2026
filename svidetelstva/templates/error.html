{% extends 'base.html' %}
{% block title %}Грешка {{ code }}{% endblock %}
{% block content %}
<div class="text-center py-20">
    <div class="text-6xl font-bold text-gray-300 dark:text-gray-700 mb-4">{{ code }}</div>
    <div class="text-lg text-gray-600 dark:text-gray-400">{{ message }}</div>
    <a href="{{ url_for('dashboard') }}" class="mt-6 inline-block px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm">← Назад</a>
</div>
{% endblock %}
