<!DOCTYPE html>
<html lang="mk" class="">
<head>
    <meta charset="UTF-8">
    <title>Најава — Сведителства</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>
        if (localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-8 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center mb-2 text-gray-900 dark:text-white">Сведителства</h1>
        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mb-6">Систем за печатење сведителства</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="mb-4 px-4 py-3 rounded text-sm bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Корисничко име</label>
                <input type="text" name="username" required autofocus
                    class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Лозинка</label>
                <input type="password" name="password" required
                    class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded transition">
                Најави се
            </button>
        </form>

        <div class="mt-6 text-right">
            <button onclick="toggleTheme()" class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">☀ / ☾ тема</button>
        </div>
    </div>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }
    </script>
</body>
</html>
